<!DOCTYPE html>
<html lang="ko" class="h-full antialiased">
<head>
  <script>try{var root=document.documentElement;function wantDark(){var t=localStorage.getItem("theme");return t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches)}function applyTheme(){root.classList.toggle("theme-dark",wantDark())}applyTheme();new MutationObserver(function(){if(root.classList.contains("theme-dark")!==wantDark())applyTheme()}).observe(root,{attributes:true,attributeFilter:["class"]})}catch(e){}</script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>할일 목록 - 내 다이어리</title>
  <link rel="stylesheet" href="/_next/static/chunks/101054-68iv1y.css"/>
  <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
</head>
<body class="min-h-full">
  <main class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800">
    <div class="container todo-page mx-auto px-4 py-8" style="flex:1;display:flex;flex-direction:column;width:100%">
      <div class="todo-head">
        <div class="todo-head-lead">
          <h1 class="todo-heading text-gray-800 dark:text-white">할일 목록</h1>
          <p id="todo-count" class="text-gray-600 dark:text-gray-300">할일을 불러오는 중</p>
        </div>
        <div class="todo-head-actions">
          <input id="todo-search" class="todo-search" type="search" placeholder="제목 검색" aria-label="제목 검색" autocomplete="off"/>
          <button id="todo-open" class="todo-add-btn" type="button">할일 추가</button>
        </div>
      </div>
      <p id="todo-error" class="text-sm mb-4" style="color:#dc2626" hidden></p>
      <div class="todo-layout">
        <aside class="todo-filter-side" aria-label="할일 필터">
          <div class="todo-filter-block">
            <h2 class="todo-filter-title">조회 연월</h2>
            <div class="todo-period">
              <label class="todo-sr" for="todo-filter-year">연도</label>
              <select id="todo-filter-year" aria-label="연도"></select>
              <button id="todo-filter-all" class="todo-filter-all" type="button">전체 기간</button>
            </div>
            <div id="todo-filter-months" class="todo-month-filters" role="toolbar" aria-label="월 필터"></div>
          </div>
          <div class="todo-filter-block">
            <h2 class="todo-filter-title">태그</h2>
            <div id="todo-tag-filters" class="todo-tag-filters" role="toolbar" aria-label="태그 필터"></div>
          </div>
        </aside>
        <section class="todo-main-pane" aria-label="할일 목록">
          <p id="todo-empty" class="text-gray-500 dark:text-gray-400" hidden>아직 할일이 없습니다.</p>
          <ul id="todo-list"></ul>
        </section>
      </div>
    </div>
  </main>
  <dialog id="notion-dialog" class="todo-dialog notion-dialog">
    <div class="notion-head">
      <h2 class="todo-heading">노션에 붙여넣기</h2>
      <div class="todo-actions">
        <button id="notion-copy" class="ks-btn ks-btn-primary" type="button">복사</button>
        <button id="notion-close" class="ks-btn" type="button">닫기</button>
      </div>
    </div>
    <div id="notion-preview" class="notion-preview"></div>
  </dialog>
  <dialog id="todo-dialog" class="todo-dialog">
    <form id="todo-form" class="todo-form">
        <select id="todo-status" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white" aria-label="진행상태">
          <option value="진행중" selected>진행중</option>
          <option value="모니터링중">모니터링중</option>
          <option value="완료">완료</option>
        </select>
        <select id="todo-priority" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white" aria-label="중요도">
          <option value="높음">높음</option>
          <option value="보통" selected>보통</option>
          <option value="낮음">낮음</option>
        </select>
        <input id="todo-tag" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white" type="text" maxlength="40" placeholder="태그" autocomplete="off"/>
        <input id="todo-requester" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white" type="text" maxlength="40" placeholder="요청자" autocomplete="off"/>
        <input id="todo-input" class="todo-title-input w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white" type="text" maxlength="200" placeholder="할일을 입력하세요" autocomplete="off"/>
        <button id="todo-submit" class="ks-btn ks-btn-primary" type="submit" form="todo-form">추가</button>
        <button id="todo-cancel" class="ks-btn" type="button" hidden>취소</button>
        <input id="todo-created-date" class="todo-carry-date" type="date" hidden/>
        <button id="todo-carry" class="ks-btn todo-carry-btn" type="button" hidden>이월</button>
        <div id="todo-work-label" class="todo-label">작업내용</div>
        <div class="todo-editor">
          <div class="wysiwyg-bar">
            <button type="button" data-cmd="bold"><b>B</b></button>
            <button type="button" data-cmd="italic"><i>I</i></button>
            <button type="button" data-cmd="underline"><u>U</u></button>
            <button type="button" data-cmd="insertUnorderedList">목록</button>
            <button type="button" data-cmd="insertOrderedList">번호</button>
          </div>
          <div id="todo-work" class="todo-work" contenteditable="true" data-placeholder="작업 내용을 입력하세요"></div>
        </div>
        <div class="todo-label">작업파일</div>
        <div id="todo-files"></div>
      </form>
  </dialog>
  <script src="/dock.js"></script>
  <script src="/todos.js"></script>
</body>
</html>
