<!DOCTYPE html>
<html lang="ko" class="h-full antialiased">
<head>
  <script>try{var root=document.documentElement;function wantDark(){var t=localStorage.getItem("theme");return t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches)}function applyTheme(){root.classList.toggle("theme-dark",wantDark())}applyTheme();new MutationObserver(function(){if(root.classList.contains("theme-dark")!==wantDark())applyTheme()}).observe(root,{attributes:true,attributeFilter:["class"]})}catch(e){}</script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>입학설명회 일정 - 내 다이어리</title>
  <link rel="stylesheet" href="/_next/static/chunks/101054-68iv1y.css"/>
  <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
</head>
<body class="min-h-full">
  <main class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-gray-900 dark:to-gray-800">
    <div class="container todo-page mx-auto px-4 py-8" style="flex:1;display:flex;flex-direction:column;width:100%">
      <div class="todo-head sched-page-head">
        <h1 class="todo-heading text-gray-800 dark:text-white">입학설명회 일정</h1>
      </div>
      <div class="sched-toolbar">
        <div class="sched-nav">
          <button id="cal-prev" class="ks-btn" type="button">이전달</button>
          <h2 id="cal-label" class="sched-label"></h2>
          <button id="cal-next" class="ks-btn" type="button">다음달</button>
          <button id="cal-today" class="ks-btn ks-btn-quiet" type="button">오늘</button>
          <button id="cal-add" class="ks-btn ks-btn-primary" type="button">+ 일정 추가</button>
        </div>
      </div>
      <div class="adm-legend" aria-label="일정 종류">
        <span><i class="adm-dot is-reg-open"></i>접수</span>
        <span><i class="adm-dot is-info"></i>설명회</span>
        <span><i class="adm-dot is-app"></i>원서접수</span>
        <span><i class="adm-dot is-lot"></i>추첨</span>
        <span><i class="adm-dot is-reg"></i>등록</span>
        <span class="adm-legend-sep" aria-hidden="true"></span>
        <span><i class="adm-prio-mark is-high"></i>높음</span>
        <span><i class="adm-prio-mark is-medium"></i>보통</span>
        <span><i class="adm-prio-mark is-low"></i>낮음</span>
      </div>
      <div class="adm-layout">
        <aside id="cal-detail" class="adm-detail" aria-label="일정 상세">
          <div class="adm-detail-empty">달력에서 일정을 선택하면 상세 내용이 여기에 표시됩니다.</div>
        </aside>
        <section class="adm-board" aria-label="월간 달력">
          <div class="sched-week" aria-hidden="true">
            <span class="is-sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="is-sat">토</span>
          </div>
          <div id="cal-grid" class="adm-grid"></div>
        </section>
      </div>
      <div class="adm-tips">
        <h3>유의사항</h3>
        <ul>
          <li>설명회 참여 신청은 각 학교 홈페이지에서 사전 예약이 필요합니다.</li>
          <li>일부 학교는 설명회 신청이 조기 마감될 수 있으니 서둘러 신청하세요.</li>
          <li>원서접수는 서울사립초입학포털(https://www.kspesa.com)에서 진행됩니다.</li>
          <li>최대 3개 학교까지 지원 가능합니다.</li>
          <li>중복 등록 시 모든 학교의 입학이 취소되니 주의하세요.</li>
        </ul>
      </div>
    </div>
  </main>
  <dialog id="cal-dialog" class="todo-dialog sched-dialog">
    <form id="cal-form" class="sched-form">
      <h2 id="cal-form-title" class="todo-heading">일정 추가</h2>
      <label class="todo-label" for="cal-title">제목</label>
      <input id="cal-title" type="text" maxlength="200" required autocomplete="off"/>
      <label class="todo-label" for="cal-school">학교</label>
      <select id="cal-school"></select>
      <label class="todo-label" for="cal-date">날짜</label>
      <input id="cal-date" type="date" required/>
      <label class="todo-label" for="cal-time">시간</label>
      <input id="cal-time" type="time"/>
      <label class="todo-label" for="cal-type">종류</label>
      <select id="cal-type">
        <option value="registration-open">접수</option>
        <option value="info-session">설명회</option>
        <option value="application">원서접수</option>
        <option value="lottery">추첨</option>
        <option value="registration">등록</option>
      </select>
      <div class="sched-priority" role="group" aria-label="중요도">
        <span class="todo-label">중요도</span>
        <div class="sched-priority-options">
          <button type="button" class="sched-priority-btn" data-priority="high">높음</button>
          <button type="button" class="sched-priority-btn is-on" data-priority="medium">보통</button>
          <button type="button" class="sched-priority-btn" data-priority="low">낮음</button>
        </div>
      </div>
      <label class="todo-label" for="cal-desc">설명</label>
      <textarea id="cal-desc" maxlength="1000" rows="3"></textarea>
      <div class="sched-actions">
        <button class="ks-btn ks-btn-primary" type="submit">저장</button>
        <button id="cal-form-close" class="ks-btn" type="button">닫기</button>
      </div>
    </form>
  </dialog>
  <script src="/dock.js"></script>
  <script src="/calendar.js"></script>
</body>
</html>
