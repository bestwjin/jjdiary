name = "nae-diary-notify"
main = "src/index.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

[vars]
SYNC_TOKEN = "575dc6f9f6eafc1d4246ca0c4991655e"

# Aiven Postgres connection string. Set with:
# wrangler secret put DATABASE_URL
# postgresql://user:password@host:port/defaultdb?sslmode=require
#
# 공공데이터포털 특일정보(KASI) 인증키. Set with:
# wrangler secret put KASI_SERVICE_KEY

[[kv_namespaces]]
binding = "DIARY"
id = "390c3350adfe4146b52fc960a9c872a0"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "18381dcb0fe94af88fce259ea50550c6"

[[durable_objects.bindings]]
name = "TELEGRAM_SCHEDULER"
class_name = "TelegramScheduler"

[[migrations]]
tag = "v1-telegram-scheduler"
new_sqlite_classes = ["TelegramScheduler"]

[triggers]
# 5분: 알림 / 10분: 메일 / 1분: 텔레그램 예약 백업(1초 단위는 Durable Object)
crons = ["* * * * *", "*/5 * * * *", "*/10 * * * *"]
